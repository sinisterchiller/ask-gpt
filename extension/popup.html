<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>ChatGPT Bridge</h1>

    <!-- Server Status -->
    <section class="section">
      <h2>Server</h2>
      <div id="server-status" class="status-indicator">
        <span class="dot" id="server-dot"></span>
        <span id="server-text">Connecting...</span>
      </div>
    </section>

    <!-- Current Tab -->
    <section class="section">
      <h2>Current Tab</h2>
      <div id="current-tab-info" class="tab-info">
        <span id="current-tab-title">No tab inspected</span>
      </div>
      <button id="btn-assign" class="btn btn-primary">Assign Current Tab</button>
    </section>

    <!-- Assigned Tab -->
    <section class="section">
      <h2>Assigned Tab</h2>
      <div id="assigned-tab-info" class="tab-info">
        <span id="assigned-tab-status">Not assigned</span>
        <span id="assigned-tab-id"></span>
      </div>
      <div class="button-row">
        <button id="btn-open" class="btn btn-secondary" disabled>Open Assigned Tab</button>
        <button id="btn-unassign" class="btn btn-danger" disabled>Unassign</button>
      </div>
    </section>

    <!-- Bridge Control -->
    <section class="section">
      <h2>Bridge</h2>
      <div id="bridge-status" class="status-indicator">
        <span class="dot" id="bridge-dot"></span>
        <span id="bridge-text">Enabled</span>
      </div>
      <button id="btn-toggle" class="btn btn-warning">Disable Bridge</button>
    </section>

    <!-- Token Info -->
    <section class="section">
      <h2>Authentication</h2>
      <div id="token-info" class="token-info">
        Token: <span id="token-display">---</span>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
